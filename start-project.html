<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start your project — AI-Group</title>
<meta name="description" content="Tell us about your project and receive a project request ID immediately.">
<meta property="og:type" content="website">
<meta property="og:title" content="Start your project — AI-Group">
<meta property="og:description" content="Tell us about your project and receive a project request ID immediately.">
<meta property="og:site_name" content="AI-Group Software and Networks Algorithms LLC">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"AI-Group Software and Networks Algorithms LLC","foundingDate":"2023","address":{"@type":"PostalAddress","addressLocality":"Bellevue","addressRegion":"WA","addressCountry":"US"},"areaServed":"Worldwide","knowsLanguage":["en","fr","pt","es"],"url":"https://alongiti2.github.io/ai-group/"}
</script>
</head>
<body data-page="start">
<div id="site-header"></div>
<main id="main">

<section><div class="wrap"><div class="section-head"><h1 data-i18n="start.h1"></h1><p class="lead" data-i18n="start.sub"></p></div>
<form data-form="project" novalidate>
  <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
  <fieldset><legend data-i18n="start.sections.0"></legend><div class="f-grid">
    <div class="field"><label for="p-name" data-i18n="start.f.name"></label><input id="p-name" name="name" type="text" required autocomplete="name"><p class=err></p></div>
    <div class="field"><label for="p-company" data-i18n="start.f.company"></label><input id="p-company" name="company" type="text" autocomplete="organization"></div>
    <div class="field"><label for="p-country" data-i18n="start.f.country"></label><input id="p-country" name="country" type="text" required autocomplete="country-name"><p class=err></p></div>
    <div class="field"><label for="p-email" data-i18n="start.f.email"></label><input id="p-email" name="email" type="email" required autocomplete="email"><p class=err></p></div>
    <div class="field"><label for="p-phone" data-i18n="start.f.phone"></label><input id="p-phone" name="phone" type="tel" autocomplete="tel"></div>
    <div class="field"><label for="p-lang" data-i18n="start.f.language"></label><select id="p-lang" name="preferred_language" data-options="languages"></select></div>
    <div class="field"><label for="p-size" data-i18n="start.f.size"></label><select id="p-size" name="company_size" data-options="start.sizes"></select></div>
    <div class="field"><label for="p-industry" data-i18n="start.f.industry"></label><input id="p-industry" name="industry" type="text" ></div>
  </div></fieldset>
  <fieldset><legend data-i18n="start.sections.1"></legend><div class="f-grid">
    <div class="field full"><label for="p-type" data-i18n="start.f.type"></label><select id="p-type" name="project_type" data-options="start.types" required></select><p class=err></p></div>
    <div class="field full"><label for="p-desc" data-i18n="start.f.description"></label><textarea id="p-desc" name="description" required></textarea><p class=err></p></div>
    <div class="field full"><label for="p-problem" data-i18n="start.f.problem"></label><textarea id="p-problem" name="business_problem"></textarea></div>
    <div class="field full"><label for="p-users" data-i18n="start.f.users"></label><input id="p-users" name="target_users" type="text" ></div>
    <div class="field full"><label data-i18n="start.f.platforms"></label><div class="checks" data-checks="start.platforms" data-name="platforms"></div></div>
  </div></fieldset>
  <fieldset><legend data-i18n="start.sections.2"></legend><div class="f-grid">
    <div class="field"><label for="p-etech" data-i18n="start.f.existingTech"></label><input id="p-etech" name="existing_technology" type="text" ></div>
    <div class="field"><label for="p-dtech" data-i18n="start.f.desiredTech"></label><input id="p-dtech" name="desired_technology" type="text" ></div>
    <div class="field"><label for="p-sec" data-i18n="start.f.securityReq"></label><input id="p-sec" name="security_requirements" type="text" ></div>
    <div class="field"><label for="p-comp" data-i18n="start.f.complianceReq"></label><input id="p-comp" name="compliance_requirements" type="text" ></div>
    <div class="field full"><label for="p-int" data-i18n="start.f.integrations"></label><input id="p-int" name="integrations" type="text" ></div>
  </div></fieldset>
  <fieldset><legend data-i18n="start.sections.3"></legend><div class="f-grid">
    <div class="field full"><label for="p-budget" data-i18n="start.f.budget"></label><select id="p-budget" name="budget_range" data-options="start.budgets"></select></div>
    <div class="field"><label for="p-start" data-i18n="start.f.startDate"></label><input id="p-start" name="desired_start" type="date" ></div>
    <div class="field"><label for="p-end" data-i18n="start.f.endDate"></label><input id="p-end" name="target_completion" type="date" ></div>
    <div class="field full"><label for="p-attach" data-i18n="start.f.attachments"></label><input id="p-attach" name="attachments_link" type="url" placeholder="https://"><small data-i18n="start.f.attachNote"></small></div>
    <div class="field"><label for="p-cm" data-i18n="start.f.contactMethod"></label><select id="p-cm" name="preferred_contact" data-options="start.contactMethods"></select></div>
    <div class="field full"><label class="check"><input type="checkbox" name="consent" required value="yes"><span data-i18n="start.f.consent"></span></label><p class="err"></p></div>
  </div></fieldset>
  <div class="btn-row"><button class="btn teal" type="submit" data-i18n="start.f.submit"></button></div>
</form>
<div id="form-result" hidden></div>
</div></section>

</main>
<div id="site-footer"></div>
<script src="site.config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
